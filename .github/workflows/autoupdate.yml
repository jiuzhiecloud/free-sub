name: Auto Fetch Nodes

on:
  schedule:
    - cron: '0 */6 * * *' # 每6小时运行一次 (UTC时间，换算为北京时间是 08:00, 14:00, 20:00, 02:00)
  workflow_dispatch: # 允许手动在 Actions 页面触发执行

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Bun Environment
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install

      - name: Execute Web Scraper
        run: bun run begin

      - name: 更新 README 和 docs 时间戳
        run: |
          # 1. 设置时区为北京时间
          export TZ='Asia/Shanghai'
          # 2. 获取当前时间
          CURRENT_TIME=$(date "+%Y-%m-%d %H:%M:%S")
          
          # 3. 检查 README.md 中是否已经有“更新于”字样
          if grep -q "节点状态最后自动更新于" README.md; then
            # 如果有，直接整行替换，避免产生多余空行
            sed -i "s/.*节点状态最后自动更新于.*/> ⏱️ 节点状态最后自动更新于 $CURRENT_TIME/" README.md
          else
            # 如果没有（比如第一次运行），则在末尾追加
            echo "" >> README.md
            echo "> ⏱️ 节点状态最后自动更新于 $CURRENT_TIME" >> README.md
          fi
          
          # 4. 将生成的 README.md 复制为 docs.md，确保两者内容完全同步以供 GitHub Pages 渲染
          cp README.md docs.md

      - name: Commit and Push Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # 将抓取的数据、原始 README 以及同步的 docs.md 全部加入暂存区
          git add data/ README.md docs.md
          
          # 如果文件有变化就 commit 并 push，没变化就跳过不报错
          git commit -m "chore: 同步最新优化节点数据并更新时间" || echo "No changes to commit"
          git push
